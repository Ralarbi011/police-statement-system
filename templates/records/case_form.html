{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-8"><div class="card p-4">
  <h1 class="h4 mb-3">{% if case %}Edit case {{ case.case_number }}{% else %}Open new case{% endif %}</h1>
  <form method="post" novalidate>{% csrf_token %}
    {% include "includes/form_fields.html" %}
    <button class="btn btn-primary">{% if case %}Save changes{% else %}Open case{% endif %}</button>
    <a class="btn btn-link" href="{% if case %}{{ case.get_absolute_url }}{% else %}{% url 'case_list' %}{% endif %}">Cancel</a>
  </form>
</div></div></div>
{% endblock %}
