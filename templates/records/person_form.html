{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-8"><div class="card p-4">
  <h1 class="h4 mb-1">{% if person %}Edit {{ person }}{% else %}Register person{% endif %}</h1>
  {% if case %}<p class="text-muted">Will be added to case <strong>{{ case.case_number }}</strong>.</p>{% endif %}
  <form method="post" novalidate>{% csrf_token %}
    {% if case %}<input type="hidden" name="link_case" value="{{ case.pk }}"><input type="hidden" name="link_role" value="{{ role }}">{% endif %}
    {% include "includes/form_fields.html" %}
    <button class="btn btn-primary">Save</button>
    <a class="btn btn-link" href="{% if person %}{{ person.get_absolute_url }}{% elif case %}{{ case.get_absolute_url }}{% else %}{% url 'person_list' %}{% endif %}">Cancel</a>
  </form>
</div></div></div>
{% endblock %}
